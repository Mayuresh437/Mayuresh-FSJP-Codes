<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            text-align: center;
            background-color: salmon;
        }
    </style>
</head>
<body>
    <h1>Welcome!</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quas, pariatur?</p>
    <button onclick="changebgcolor()">Change Background</button>

    <script>

        function changebgcolor(){
            let colors = ["red", "blue", "green", "yellow", "orange", "pink"];
            const bodyEle = document.querySelector("body");
            let randomIndex = Math.floor(Math.random()*colors.length);
            bodyEle.style.backgroundColor = colors[randomIndex];
        }

        setInterval(() => {
            changebgcolor();
        }, 500);
    </script>
</body>
</html>
